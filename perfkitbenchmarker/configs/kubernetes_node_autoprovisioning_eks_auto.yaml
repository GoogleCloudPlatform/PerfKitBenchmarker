kubernetes_node_autoprovisioning:
  description: >
    Cold node-autoprovisioning scaling latency on EKS Auto Mode (managed
    counterpart to GKE NAP and AKS NAP), with a custom NodePool restricted to
    m8i.xlarge instances.
  flags:
    container_cluster_version: "1.33"
    node_autoprovisioning_platform: "eks_auto"
    node_autoprovisioning_worker_label: "pkb_nodepool=provisioning"
  container_cluster:
    cloud: AWS
    type: Auto
    min_vm_count: 0
    max_vm_count: 100
    vm_spec:
      AWS:
        machine_type: m8i.xlarge
        zone: us-east-2a
